  </g>
  <path d="M213 111c23-39 66-57 101-45-38 22-65 54-81 96-17-10-27-26-20-51Z" fill="url(#facet)" opacity=".85"/>
  <path d="m314 80 21 52-26-17-18 48 2-70Z" fill="#fff" opacity=".78" filter="url(#soft)"/>
