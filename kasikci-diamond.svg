    <circle cx="430" cy="140" r="16"/><circle cx="447" cy="196" r="17"/><circle cx="438" cy="254" r="16"/>
    <circle cx="407" cy="305" r="17"/><circle cx="358" cy="341" r="16"/><circle cx="299" cy="356" r="17"/>
    <circle cx="238" cy="351" r="16"/><circle cx="181" cy="328" r="17"/><circle cx="137" cy="287" r="16"/>
    <circle cx="113" cy="234" r="17"/><circle cx="113" cy="176" r="16"/><circle cx="135" cy="122" r="17"/>
    <circle cx="178" cy="81" r="16"/><circle cx="231" cy="59" r="17"/>
  </g>
  <ellipse cx="280" cy="204" rx="128" ry="157" fill="#8dd7ff" opacity=".22" filter="url(#glow)"/>
  <ellipse cx="280" cy="204" rx="118" ry="147" fill="url(#gem)" stroke="#f8fdff" stroke-width="5"/>
  <g fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="2">
