<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title description">
  <title id="title">Kaşıkçı Elması illüstrasyonu</title>
  <desc id="description">Koyu bir zemin üzerinde parlayan oval kesim elmas ve onu çevreleyen küçük taşlar.</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#6d4aff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#344054" stop-opacity=".18"/>
      <stop offset="1" stop-color="#101828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gem" cx="38%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".22" stop-color="#e9f9ff"/>
      <stop offset=".58" stop-color="#b9dff5"/>
      <stop offset="1" stop-color="#7188bd"/>
    </radialGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#a99aff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="560" height="420" rx="32" fill="#101828"/>
  <ellipse cx="280" cy="202" rx="245" ry="184" fill="url(#backdrop)"/>
